[project]
name = "system-indentification-with-nn-fuzzy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=0.10.35",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "optimizely>=0.5",
    "pandas>=3.0.5",
    "pre-commit>=4.6.2",
    "pyyaml>=6.0.3",
    "spicy>=0.16.0",
]

[tool.ruff]
lint.select = ["E", "F", "I"] # Enable pycodestyle (`E`), Pyflakes (`F`) and Isort(`I`) codes.
lint.ignore = ["E501", "F403", "E741"]
line-length = 125
